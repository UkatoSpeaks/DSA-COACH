# A generic, single database configuration.

[alembic]

# Path to migration scripts.
script_location = %(here)s/app/db/migrations

# Python path.
prepend_sys_path = .

# Path separator for lists.
path_separator = os

# Database URL.
# The actual DATABASE_URL is loaded from .env by app/db/migrations/env.py
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers = console
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S