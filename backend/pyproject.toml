[project]
name = "ai-learning-agent-backend"
version = "0.1.0"
description = "Backend for an adaptive AI DSA learning agent"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "chromadb>=1.5.9",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.30.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langgraph>=1.2.11",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.52",
    "torch>=2.14.0",
    "transformers>=5.16.1",
    "tree-sitter>=0.26.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]
